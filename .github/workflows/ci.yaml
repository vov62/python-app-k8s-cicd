name: python-cicd

on:
    push:
        branches:
            - main 
    pull_request:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: python-app
    
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.12'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
            
            - name: Run tests
              run: |
                  python -m pytest
            
            #   docker config
            - name: Build Docker image
              run: |
                  docker build -t vovhubdoc/python-app:${{ github.sha }} .
            
            - name: Login to Docker hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Push Docker image
              run: |
                  docker push vovhubdoc/python-app:${{ github.sha }}
            
          
            - name: Clone GitOps repository
              run: |
                  git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/vov62/python-app-gitops.git ../gitops
               
            
            - name: Update Kubernetes image
              run: |
                  sed -i "s|image: vovhubdoc/python-app:.*|image: vovhubdoc/python-app:${{ github.sha }}|" ../gitops/k8s/deployment.yaml
            
            
            - name: Commit and push GitOps changes
              run: |
                cd ../gitops
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add k8s/deployment.yaml
                git commit -m "Update image to ${{ github.sha }}"
                git push origin main
